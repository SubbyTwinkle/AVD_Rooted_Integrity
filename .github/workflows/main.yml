name: Build Ninja Kernel
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y docker.io
        
      - name: Build the Custom Kernel
        run: |
          cd kernel-build
          sudo docker build -t kbuild .
          sudo docker run --rm -v "$PWD":/work -w /work kbuild ./scripts/build-all.sh
          
      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz
          path: kernel-build/out/Image.gz
